name: Notification - CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  JAVA_VERSION: '17'

jobs:
  # ============================================================================
  # Job 1: Code Quality
  # ============================================================================
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Compile project
        run: |
          chmod +x mvnw
          ./mvnw compile -DskipTests -q --batch-mode

  # ============================================================================
  # Job 2: Backend Tests
  # Sin BD ni Liquibase. Necesita Kafka para consumers.
  # ============================================================================
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: [code-quality]
    timeout-minutes: 15

    services:
      kafka:
        image: apache/kafka-native:4.0.0
        ports:
          - 9092:9092
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://localhost:9093
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-notification-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-notification

      - name: Run Backend Tests
        env:
          SPRING_CLOUD_STREAM_KAFKA_BINDER_BROKERS: localhost:9092
        run: |
          chmod +x mvnw
          ./mvnw clean verify \
            -Dlogging.level.ROOT=ERROR \
            -Dlogging.level.com.tyse.scrutiny=ERROR \
            --batch-mode

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notification-test-results
          path: target/surefire-reports/
          retention-days: 7

  # ============================================================================
  # Quality Gate
  # ============================================================================
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [code-quality, backend-tests]
    if: always()

    steps:
      - name: Check all job results
        run: |
          echo "Code Quality: ${{ needs.code-quality.result }}"
          echo "Backend Tests: ${{ needs.backend-tests.result }}"

          if [ "${{ needs.code-quality.result }}" != "success" ] || \
             [ "${{ needs.backend-tests.result }}" != "success" ]; then
            echo "❌ CI Pipeline Failed"
            exit 1
          fi

          echo "✅ CI Pipeline Passed"
