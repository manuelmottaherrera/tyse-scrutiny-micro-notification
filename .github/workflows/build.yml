name: Notification - Build Docker Image

on:
  workflow_run:
    workflows: ['Notification - CI Pipeline']
    types: [completed]
    branches: [main, develop]
  push:
    tags:
      - 'v*.*.*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch || github.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build production JAR
        run: |
          chmod +x mvnw
          ./mvnw -Pprod clean verify -DskipTests --batch-mode

      - name: Extract image tags
        id: meta
        run: |
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            BRANCH="${{ github.event.workflow_run.head_branch }}"
            SHA="${{ github.event.workflow_run.head_sha }}"
            echo "IMAGE_TAG=$BRANCH" >> $GITHUB_OUTPUT
            SHORT_SHA=$(echo $SHA | cut -c1-7)
          elif [[ $GITHUB_REF == refs/tags/* ]]; then
            TAG=${GITHUB_REF#refs/tags/}
            echo "IMAGE_TAG=$TAG" >> $GITHUB_OUTPUT
            SHORT_SHA=$(echo $GITHUB_SHA | cut -c1-7)
          fi
          echo "SHORT_SHA=$SHORT_SHA" >> $GITHUB_OUTPUT

      - name: Build and push Docker image with Jib
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IMAGE_TAG=${{ steps.meta.outputs.IMAGE_TAG }}
          SHORT_SHA=${{ steps.meta.outputs.SHORT_SHA }}
          ./mvnw -Pprod verify jib:build \
            -Djib.to.image=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${IMAGE_TAG} \
            -Djib.to.tags=${IMAGE_TAG}-${SHORT_SHA},latest \
            -Djib.to.auth.username=${{ github.actor }} \
            -Djib.to.auth.password=${{ secrets.GITHUB_TOKEN }} \
            -DskipTests --batch-mode

      - name: Trigger dev deployment
        if: github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'develop'
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.DEPLOY_PAT }}
          repository: manuelmottaherrera/tyse-scrutiny-infrastructure
          event-type: deploy-dev
          client-payload: '{"service": "notification", "source": "notification", "sha": "${{ github.sha }}"}'
