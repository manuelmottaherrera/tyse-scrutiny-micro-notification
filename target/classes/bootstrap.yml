spring:
  application:
    name: tyse-scrutiny-micro-notification
  cloud:
    consul:
      host: localhost
      port: 8500
      discovery:
        enabled: true
        instance-id: ${spring.application.name}:${random.value}
        service-name: tysescrutinymicronotification
        health-check-path: /actuator/health
        health-check-interval: 15s
      config:
        enabled: true
        format: YAML
        prefix: config
        default-context: application
        profile-separator: ','
        fail-fast: false
