<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notificación - Tyse Scrutiny</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        .header {
            background-color: #6c757d;
            color: white;
            padding: 20px;
            text-align: center;
            border-radius: 8px 8px 0 0;
        }
        .content {
            background-color: #f8f9fa;
            padding: 20px;
            border: 1px solid #dee2e6;
        }
        .message-box {
            background-color: white;
            padding: 15px;
            border-radius: 4px;
            margin: 15px 0;
            border-left: 4px solid #007bff;
        }
        .action-button {
            display: inline-block;
            background-color: #007bff;
            color: white;
            padding: 12px 24px;
            text-decoration: none;
            border-radius: 4px;
            margin: 20px 0;
        }
        .footer {
            text-align: center;
            padding: 20px;
            color: #666;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1 style="margin: 0;" th:text="${title ?: '📬 Notificación'}">📬 Notificación</h1>
    </div>

    <div class="content">
        <div class="message-box">
            <p th:text="${message ?: 'Sin mensaje'}">Mensaje de la notificación</p>
        </div>

        <div style="text-align: center;" th:if="${actionUrl}">
            <a th:href="${actionUrl}" class="action-button" th:text="${actionText ?: 'Ver más'}">Ver más</a>
        </div>

        <p style="font-size: 12px; color: #666;" th:if="${timestamp}">
            Fecha: <span th:text="${timestamp}">2024-01-01T00:00:00Z</span>
        </p>
    </div>

    <div class="footer">
        <p>Este mensaje fue generado automáticamente por Tyse Scrutiny.</p>
        <p>Por favor no responda a este correo.</p>
    </div>
</body>
</html>
