spring:
  application:
    name: tyse-scrutiny-micro-notification
  profiles:
    active: dev
  config:
    import: "optional:consul:"

  # Mail Configuration
  mail:
    host: localhost
    port: 1025
    username:
    password:
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

  # Thymeleaf for email templates
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
    cache: false

  # Kafka Configuration
  cloud:
    function:
      definition: anomalyNotificationConsumer;notificationRequestConsumer
    stream:
      kafka:
        binder:
          brokers: localhost:9092
          auto-create-topics: true
          consumer-properties:
            key.deserializer: org.apache.kafka.common.serialization.StringDeserializer
            value.deserializer: org.apache.kafka.common.serialization.StringDeserializer
      bindings:
        # Consumer for anomaly alerts
        anomalyNotificationConsumer-in-0:
          destination: e14-anomaly-detected
          content-type: application/json
          group: tyse-scrutiny-micro-notification
          consumer:
            auto-startup: true
        # Consumer for notification requests (account activation, password reset, etc.)
        notificationRequestConsumer-in-0:
          destination: notification-request
          content-type: application/json
          group: tyse-scrutiny-micro-notification
          consumer:
            auto-startup: true

server:
  port: 8085

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# Application specific settings
notification:
  # Default recipients for anomaly alerts (can be overridden per election process)
  anomaly-alert:
    default-recipients:
      - abogado1@example.com
      - abogado2@example.com
    # Minimum severity to send notifications: LOW, MEDIUM, HIGH, CRITICAL
    minimum-severity: MEDIUM
  # Base URL for links in emails
  base-url: http://localhost:8080
  # Email sender
  from: no-reply@tyse-scrutiny.com
  # Twilio configuration for WhatsApp and SMS
  twilio:
    account-sid: ${TWILIO_ACCOUNT_SID:}
    auth-token: ${TWILIO_AUTH_TOKEN:}
    whats-app:
      enabled: ${TWILIO_WHATSAPP_ENABLED:false}
      from-number: ${TWILIO_WHATSAPP_FROM:whatsapp:+14155238886}
    sms:
      enabled: ${TWILIO_SMS_ENABLED:false}
      from-number: ${TWILIO_SMS_FROM:}

logging:
  level:
    com.tyse.scrutiny.micro.notification: DEBUG
    org.springframework.cloud.stream: INFO
    org.springframework.kafka: INFO
